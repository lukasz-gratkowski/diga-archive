name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The runner image is named, not "latest", so that a new image is a change in this file.
jobs:
  unit:
    name: Unit tests
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore exactly the recorded packages
        shell: pwsh
        run: |
          # Locked mode: a package that differs from packages.lock.json fails the job, and so does one with a known high or
          # critical vulnerability (Release, Directory.Build.props). The tests below do not restore again.
          dotnet restore tests/Diga.Tests/Diga.Tests.csproj --locked-mode -p:Configuration=Release
          if ($LASTEXITCODE -ne 0) { throw 'NuGet restore failed.' }
      - name: Unit and protocol tests
        shell: pwsh
        run: |
          dotnet test tests/Diga.Tests/Diga.Tests.csproj -c Release --no-restore --filter 'Category!=Integration' --logger 'trx;LogFileName=unit.trx' --results-directory artifacts/test-results
          if ($LASTEXITCODE -ne 0) { throw 'Unit tests failed.' }
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($script in Get-ChildItem scripts -Filter '*.ps1') {
            $errors = $null
            $null = [Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$null, [ref]$errors)
            if ($errors) { throw ($errors | Out-String) }
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: unit-results
          path: artifacts/test-results/*.trx
          if-no-files-found: warn

  integration:
    name: Media, DLNA and WinUI
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Pinned media dependencies
        shell: pwsh
        run: ./scripts/Get-Dependencies.ps1
      - name: Restore exactly the recorded packages
        shell: pwsh
        run: |
          dotnet restore Diga.sln --locked-mode -p:Configuration=Release
          if ($LASTEXITCODE -ne 0) { throw 'NuGet restore failed.' }
      - name: Real media, DLNA loopback and cancellation tests
        shell: pwsh
        run: |
          dotnet test tests/Diga.Tests/Diga.Tests.csproj -c Release --no-restore --filter 'Category=Integration' --logger 'trx;LogFileName=integration.trx' --results-directory artifacts/test-results
          if ($LASTEXITCODE -ne 0) { throw 'Integration tests failed.' }
      - name: Build native WinUI application
        shell: pwsh
        run: |
          dotnet build src/Diga.App/Diga.App.csproj -c Release -p:Platform=x64 --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'WinUI build failed.' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: integration-results
          path: artifacts/test-results/*.trx
          if-no-files-found: warn
