name: Build, test and package (unsigned)
description: >
  Builds and tests the application, assembles the installer, the portable package, the diagnostics kit and the source
  archive, and checks that they install, start and uninstall. Nothing is signed here: a signed release is made by the
  build, sign and smoke jobs of release.yml, which keep the signing identity in a job of its own.
runs:
  using: composite
  steps:
    - name: Pinned Inno Setup compiler
      shell: pwsh
      run: ./scripts/Get-InnoSetup.ps1
    - name: Build and test
      shell: pwsh
      run: ./scripts/Build.ps1
    - name: Assemble installer, portable build, diagnostics, source and checksums
      shell: pwsh
      run: ./scripts/New-Release.ps1 -SkipBuild
    - name: Verify portable launch, install, installed launch, FFmpeg download and uninstall
      shell: pwsh
      run: |
        ./scripts/Test-Package.ps1 -TestInstaller -InstallerLanguage en
        ./scripts/Test-Package.ps1 -TestInstaller -InstallerLanguage pl -WithFfmpegDownload
    # For a tag the release is the lasting copy, so the artifact goes after a day. A manual run has only the artifact.
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: release-assets
        path: artifacts/release/*
        if-no-files-found: error
        retention-days: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '30' }}
    # Text only: what the smoke test wrote down and the installer's logs, never the packages that failed.
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: failure()
      with:
        name: failed-release-diagnostics
        path: |
          artifacts/package-diagnostics.txt
          artifacts/install-smoke-*-install.log
        if-no-files-found: warn
        retention-days: 7
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: release-test-results
        path: artifacts/test-results/*.trx
        if-no-files-found: warn
